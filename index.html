<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANFEER - Portal de Gestão</title>
    <link rel="icon" type="image/png" href="LOGO MINIMALISTA.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --anfeer-red: #D9231D;
            --anfeer-dark: #1E1E1E;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center p-4">

    <!-- TELA DE LOGIN -->
    <div id="loginBox" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <img src="./ANFEER BR FUNDO TRANSPARENTE.png" alt="ANFEER Logo" class="h-12 mx-auto object-contain" onerror="this.style.display='none'">
            <h1 class="text-2xl font-black text-white">ANFEER</h1>
            <p class="text-xs text-slate-400">Informe seu usuário e senha do sistema</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">USUÁRIO</label>
                <input type="text" id="userInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 uppercase">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">SENHA</label>
                <input type="password" id="passInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">
            </div>

            <p id="errorMsg" class="text-xs text-red-500 hidden font-bold text-center"></p>

            <button type="submit" id="btnLogin" class="w-full bg-[#D9231D] hover:bg-red-700 text-white font-extrabold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
            </button>
        </form>
    </div>

    <!-- PAINEL / MENU PRINCIPAL -->
    <div id="menuBox" class="hidden w-full max-w-4xl bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div class="flex items-center gap-4">
                <img src="./ANFEER BR FUNDO TRANSPARENTE.png" alt="ANFEER Logo" class="h-10 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-xl font-black text-white">ANFEER Brochas</h1>
                    <p class="text-xs text-slate-400">Usuário: <span id="lblUser" class="text-red-500 font-bold"></span></p>
                </div>
            </div>
            <button onclick="logout()" class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                <i data-lucide="log-out" class="w-4 h-4"></i> Sair
            </button>
        </div>

        <div>
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Sistemas Disponíveis</h2>
            <div id="gridModules" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- CARD 1: APONTAMENTOS -->
                <a href="./apontamentos/" class="flex items-center gap-4 p-5 bg-slate-950 border border-slate-800 rounded-xl hover:border-red-600 hover:shadow-lg transition cursor-pointer group">
                    <div class="p-3 bg-slate-900 group-hover:bg-[#D9231D] text-red-500 group-hover:text-white rounded-xl transition">
                        <i data-lucide="list-checks" class="w-7 h-7"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-white group-hover:text-red-500 transition">Controle de Apontamentos</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Painel Operacional de Produção & PLR</p>
                    </div>
                </a>

                <!-- CARD 2: MANUTENÇÃO / MÁQUINAS -->
                <a href="./maquinas/" class="flex items-center gap-4 p-5 bg-slate-950 border border-slate-800 rounded-xl hover:border-red-600 hover:shadow-lg transition cursor-pointer group">
                    <div class="p-3 bg-slate-900 group-hover:bg-[#D9231D] text-red-500 group-hover:text-white rounded-xl transition">
                        <i data-lucide="wrench" class="w-7 h-7"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-white group-hover:text-red-500 transition">Controle de Máquinas</h3>
                        <p class="text-xs text-slate-500 mt-0.5">Painel de Manutenção Preventiva</p>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://relieve-erased-projector.ngrok-free.dev';

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            checkSession();
        });

        async function checkSession() {
            const userData = localStorage.getItem('anfeer_user');
            if (userData) {
                const user = JSON.parse(userData);
                try {
                    const res = await fetch(`${API_URL}/me`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: JSON.stringify({ usuario: user.nome })
                    });

                    if (res.ok) {
                        const updatedData = await res.json();
                        localStorage.setItem('anfeer_user', JSON.stringify(updatedData));
                        showMenu(updatedData);
                    } else {
                        logout();
                    }
                } catch (e) {
                    showMenu(user);
                }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('userInput').value.trim().toUpperCase();
            const senha = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnLogin = document.getElementById('btnLogin');

            errorMsg.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.innerText = "Autenticando...";

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ usuario, senha })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Usuário ou senha incorretos.');
                }

                const data = await res.json();
                localStorage.setItem('anfeer_user', JSON.stringify(data));
                showMenu(data);

            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = "Entrar no Sistema";
            }
        }

        function showMenu(user) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('menuBox').classList.remove('hidden');
            document.getElementById('lblUser').innerText = user.nome;
            lucide.createIcons();
        }

        function logout() {
            localStorage.removeItem('anfeer_user');
            document.getElementById('menuBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
